# Manual / on-demand ETL (no schedule): static + manual tiers (ERA5-Land backfill, Copernicus DEM, CMIP6,
# LDD files) and the /admin/data "รันตอนนี้" button (GitHub workflow_dispatch with `source`).
# With `source` set, the tier filter is not applied, so any source can be run from here.
name: etl-manual

on:
  workflow_dispatch:
    inputs:
      source:
        description: "แหล่งที่จะรัน (เว้นว่าง = ทั้ง tier ที่เลือก) เช่น cop_dem, era5_land, ldd"
        required: false
        default: ""
      tier:
        description: "tier เมื่อไม่ระบุ source"
        type: choice
        options: [static, manual, daily, quarterly, semiannual]
        default: static
      dry_run:
        description: "หยุดหลัง validate (ไม่ swap)"
        type: boolean
        default: false
      force:
        description: "ไม่สนใจ checksum เดิม"
        type: boolean
        default: false

concurrency:
  group: etl-manual
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    container: ghcr.io/osgeo/gdal:ubuntu-small-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages (python venv + bsdtar for DGR .rar)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3-venv python3-pip libarchive-tools ca-certificates

      - name: Install ETL
        run: |
          python3 -m venv /opt/etl
          /opt/etl/bin/pip install -q -r etl/requirements.txt

      - name: Run ETL (manual)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ETL_ALERT_WEBHOOK: ${{ secrets.ETL_ALERT_WEBHOOK }}
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          THAIWATER_API_KEY: ${{ secrets.THAIWATER_API_KEY }}
          TMD_API_KEY: ${{ secrets.TMD_API_KEY }}
          # inputs go through env (never interpolated into the script) and are validated below
          IN_SOURCE: ${{ inputs.source }}
          IN_TIER: ${{ inputs.tier }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_FORCE: ${{ inputs.force }}
          ETL_SCOPE: ${{ vars.ETL_SCOPE }}   # 'pilot' (default, Maha Sarakham bbox) | 'nationwide'
        run: |
          set -eu
          if [ -n "${IN_SOURCE:-}" ]; then
            echo "$IN_SOURCE" | grep -Eq '^[a-z0-9_,]+$' || { echo "invalid source input"; exit 2; }
            args="--source $IN_SOURCE"
          else
            echo "$IN_TIER" | grep -Eq '^(static|manual|daily|quarterly|semiannual)$' || { echo "invalid tier"; exit 2; }
            args="--tier $IN_TIER"
          fi
          [ "${IN_DRY_RUN:-false}" = "true" ] && args="$args --dry-run"
          [ "${IN_FORCE:-false}" = "true" ] && args="$args --force"
          [ "${ETL_SCOPE:-pilot}" = "nationwide" ] && args="$args --nationwide"
          [ -n "${SUPABASE_URL:-}" ] && args="$args --upload-raw"
          /opt/etl/bin/python etl/run.py $args
